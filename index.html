<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POLA XAT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --main-color: #00ff88;
      --bg-color: #000000;
      --secondary-color: #00ff8822;
      --terminal-font: 'JetBrains Mono', monospace;
      --brand-font: 'Syne', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="10" viewBox="0 0 8 10"><path fill="%2300ff88" d="M0 0L8 5L0 10Z"/></svg>') 2 5, auto;
      background-color: var(--bg-color);
      color: var(--main-color);
      font-family: var(--terminal-font);
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
      -webkit-font-smoothing: antialiased;
    }

    .matrix-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.25;
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-card {
      width: 100%;
      background: #030704;
      border: 2px solid var(--main-color);
      overflow: hidden;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #001206;
      border-bottom: 1px solid var(--main-color);
    }

    .brand-title {
      font-family: var(--brand-font);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--main-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      background: var(--main-color);
    }

    .status-tag {
      font-size: 9px;
      padding: 2px 6px;
      border: 1px solid rgba(0, 255, 136, 0.6);
      background: #000;
      color: var(--main-color);
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* Screen Visualizer */
    .visual-screen {
      position: relative;
      height: 75px;
      background: linear-gradient(45deg, #001408 25%, #020202 25%, #020202 50%, #001408 50%, #001408 75%, #020202 75%);
      background-size: 8px 8px;
      animation: bgScroll 25s linear infinite;
      border-bottom: 1px solid var(--main-color);
      overflow: hidden;
    }

    @keyframes bgScroll {
      0% { background-position: 0 0; }
      100% { background-position: 80px 80px; }
    }

    #visualizer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .screen-tag-left {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 8px;
      color: rgba(0, 255, 136, 0.6);
      letter-spacing: 1px;
      pointer-events: none;
    }

    .screen-tag-right {
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 8px;
      color: rgba(0, 255, 136, 0.6);
      letter-spacing: 1px;
      pointer-events: none;
    }

    /* Metadata Deck */
    .meta-deck {
      padding: 8px 12px;
      background: #001006;
      border-bottom: 1px solid var(--main-color);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .track-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--main-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .track-counter {
      font-size: 9px;
      padding: 1px 5px;
      border: 1px solid rgba(0, 255, 136, 0.4);
      background: #000;
      color: var(--main-color);
      flex-shrink: 0;
    }

    .meta-sub-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5px;
      padding-top: 4px;
      border-top: 1px solid rgba(0, 255, 136, 0.25);
    }

    .bitrate-box {
      font-size: 8.5px;
      letter-spacing: 1px;
      color: var(--main-color);
    }

    /* Progress Bar */
    .progress-wrap {
      height: 7px;
      background: #00160a;
      cursor: pointer;
      position: relative;
      border-bottom: 1px solid var(--main-color);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--main-color);
      transition: width 0.08s linear;
      position: relative;
    }

    .progress-wrap:hover .progress-handle {
      opacity: 1;
    }

    .progress-handle {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translate(50%, -50%);
      width: 7px;
      height: 12px;
      background: var(--main-color);
      border: 1px solid #000;
      opacity: 0;
      transition: opacity 0.15s;
    }

    /* Controls: strictly 3 buttons */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 8px;
      background: #020503;
    }

    .control-btn {
      height: 34px;
      background: #001408;
      border: 1px solid var(--main-color);
      color: var(--main-color);
      font-family: var(--terminal-font);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-btn:hover {
      background: var(--main-color);
      color: #000;
    }

    .control-btn.playing {
      background: var(--main-color);
      color: #000;
      font-weight: 700;
    }

    .control-btn:active {
      transform: scale(0.98);
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 12px;
      background: #001006;
      border-top: 1px solid rgba(0, 255, 136, 0.6);
      font-size: 9px;
      letter-spacing: 1px;
    }

    /* Playlist Module */
    .playlist-card {
      width: 100%;
      background: #030704;
      border: 1px solid var(--main-color);
      display: flex;
      flex-direction: column;
    }

    .playlist-header {
      padding: 6px 12px;
      background: #001408;
      border-bottom: 1px solid var(--main-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    .playlist-items {
      max-height: 155px;
      overflow-y: auto;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .playlist-items::-webkit-scrollbar {
      width: 3px;
    }
    .playlist-items::-webkit-scrollbar-track {
      background: #020703;
    }
    .playlist-items::-webkit-scrollbar-thumb {
      background: var(--main-color);
    }

    .playlist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 8px;
      font-size: 10.5px;
      color: var(--main-color);
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      white-space: nowrap;
      overflow: hidden;
    }

    .playlist-item .track-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .playlist-item:hover {
      background: var(--main-color);
      color: #000;
      font-weight: 600;
    }

    .playlist-item.active {
      background: var(--main-color);
      color: #000;
      font-weight: 700;
    }

    .track-badge {
      font-size: 8px;
      font-weight: 700;
      padding: 1px 4px;
      border: 1px solid #000;
      margin-left: 6px;
      flex-shrink: 0;
    }

    @media (max-width: 360px) {
      .wrapper {
        max-width: 100%;
      }
      .brand-title {
        font-size: 14px;
      }
      .control-btn {
        font-size: 10px;
        height: 32px;
      }
    }
  </style>
</head>
<body>

  <canvas class="matrix-bg" id="matrixCanvas"></canvas>

  <div class="wrapper">
    <!-- Main Player Deck -->
    <div class="player-card">
      <div class="header-bar">
        <div class="brand-title">
          <span class="brand-dot"></span>
          <span>POLA XAT</span>
        </div>
        <div class="status-tag" id="statusTag">STANDBY</div>
      </div>

      <!-- Oscilloscope Visualizer Screen -->
      <div class="visual-screen">
        <canvas id="visualizer"></canvas>
        <span class="screen-tag-left">OSC // LIVE WAVE</span>
        <span class="screen-tag-right" id="oscState">IDLE</span>
      </div>

      <!-- Track Information & Telemetry Deck -->
      <div class="meta-deck">
        <div class="meta-top-row">
          <div style="display:flex; align-items:center; gap:6px; overflow:hidden;">
            <span style="font-size:10px;">♫</span>
            <span class="track-title" id="trackTitle">ANA ELMAZLOM</span>
          </div>
          <span class="track-counter" id="trackCounter">01/34</span>
        </div>

        <div class="meta-sub-row">
          <span id="timeDisplay">00:00 / 00:00</span>
          <div class="bitrate-box">
            <span>BITRATE: </span>
            <strong id="bitrate">320 KBPS</strong>
          </div>
        </div>
      </div>

      <!-- Interactive Progress Bar -->
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-fill" id="progressFill">
          <div class="progress-handle"></div>
        </div>
      </div>

      <!-- Strict 3 Controls -->
      <div class="controls-grid">
        <button class="control-btn" id="prevBtn" type="button">⏮ PREV</button>
        <button class="control-btn" id="playBtn" type="button">▶ PLAY</button>
        <button class="control-btn" id="nextBtn" type="button">NEXT ⏭</button>
      </div>

      <!-- Footer Telemetry -->
      <div class="status-bar">
        <span>VOL: 100%</span>
        <span>AUDIO: HD STEREO</span>
      </div>
    </div>

    <!-- Playlist Deck -->
    <div class="playlist-card">
      <div class="playlist-header">
        <div style="display:flex; align-items:center; gap:6px;">
          <span style="width:5px; height:5px; background:var(--main-color);"></span>
          <span>PLAYLIST // الأغاني</span>
        </div>
        <span id="listCounter" style="border:1px solid rgba(0,255,136,0.4); padding:1px 5px; background:#000;">01 / 34</span>
      </div>
      <div class="playlist-items" id="playlistItems"></div>
    </div>
  </div>

  <audio id="audioElement" crossOrigin="anonymous" preload="metadata"></audio>

  <script>
    const TRACKS = [

      { id: 4, title: 'Gönül Yarası', url: 'https://audio.jukehost.co.uk/01a066ea-434b-720b-98cd-97646cb07b82' },
      { id: 5, title: 'Law Lesa Faker', url: 'https://audio.jukehost.co.uk/01a06cbf-d6ee-7224-afa0-6940adcc347c' },
      { id: 6, title: 'Mqhora', url: 'https://audio.jukehost.co.uk/01a06cbf-d79e-706b-b0ae-f3c32c0acc96' },
      { id: 7, title: 'Najmat Tariqi', url: 'https://audio.jukehost.co.uk/01a06cbf-d6dd-72c2-bff8-14a41d00f5ae' },

      { id: 12, title: 'Ya Wely', url: 'https://audio.jukehost.co.uk/01a06cbf-d6c4-705d-8af0-2d598bb37d5d' },
      { id: 13, title: 'Ya Zalim', url: 'https://audio.jukehost.co.uk/01a06cbf-d748-71c9-aa0e-8fae840f1fdd' },

      { id: 15, title: 'Teir Fessama', url: 'https://audio.jukehost.co.uk/01a069f6-84b4-73e4-b0ab-b787d31a3b54' },
      { id: 16, title: 'Law kol Asheg', url: 'https://audio.jukehost.co.uk/01a069f6-8452-7249-ab87-40223f5f1211' },
      { id: 17, title: 'law Betheb Haqiqi', url: 'https://audio.jukehost.co.uk/5c7ed66a-40b0-11f1-a012-fa163edb0845' },
      { id: 18, title: 'Bahlam', url: 'https://audio.jukehost.co.uk/01a069f6-84e7-73df-92a6-f02d52e624b3' },
      { id: 19, title: 'Azaik Habiby', url: 'https://audio.jukehost.co.uk/549779fd-40b0-11f1-a012-fa163edb0845' },
      { id: 20, title: 'Bano Bano', url: 'https://audio.jukehost.co.uk/5487685e-40b0-11f1-a012-fa163edb0845' },
      { id: 21, title: 'Einy', url: 'https://audio.jukehost.co.uk/582acc94-40b0-11f1-a012-fa163edb0845' },
      { id: 22, title: 'Hagat', url: 'https://audio.jukehost.co.uk/577035af-40b0-11f1-a012-fa163edb0845' },
      { id: 23, title: 'Eskoti', url: 'https://audio.jukehost.co.uk/579e90ea-40b0-11f1-a012-fa163edb0845' },
      { id: 24, title: 'Elly Gai Ahla', url: 'https://audio.jukehost.co.uk/572fe645-40b0-11f1-a012-fa163edb0845' },
      { id: 25, title: 'Awsefhalk', url: 'https://audio.jukehost.co.uk/5e5f6bb2-40b0-11f1-a012-fa163edb0845' },
      { id: 26, title: 'Ttghiri', url: 'https://audio.jukehost.co.uk/53a9b1e9-40b0-11f1-a012-fa163edb0845' },
      { id: 27, title: 'Tani Eih', url: 'https://audio.jukehost.co.uk/537d12a5-40b0-11f1-a012-fa163edb0845' },
      { id: 28, title: 'El Tofan', url: 'https://audio.jukehost.co.uk/5d5ed86f-40b0-11f1-a012-fa163edb0845' },
      { id: 29, title: 'Wnghna', url: 'https://audio.jukehost.co.uk/5c232bca-40b0-11f1-a012-fa163edb0845' },
      { id: 30, title: 'Kol Elly Fat', url: 'https://audio.jukehost.co.uk/59ca8b09-40b0-11f1-a012-fa163edb0845' },
      { id: 31, title: 'Kol Sana Wenta Taib', url: 'https://audio.jukehost.co.uk/5cdca455-40b0-11f1-a012-fa163edb0845' },
      { id: 32, title: 'Akhbark Eih', url: 'https://audio.jukehost.co.uk/5a52c78e-40b0-11f1-a012-fa163edb0845' },
      { id: 33, title: 'Bahbk Enta', url: 'https://audio.jukehost.co.uk/01a069f6-84a4-7131-bb6b-49633375aed4' },
      { id: 34, title: 'Bl3b Asasi', url: 'https://audio.jukehost.co.uk/01a069f6-836f-731e-af84-51e341f99899' }
    ];

    // Background Matrix Rain
    const matrixCanvas = document.getElementById('matrixCanvas');
    const mCtx = matrixCanvas.getContext('2d');
    const matrixChars = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    let drops = [];

    function initMatrix() {
      matrixCanvas.width = window.innerWidth;
      matrixCanvas.height = window.innerHeight;
      const cols = Math.floor(matrixCanvas.width / 12);
      drops = Array(cols).fill(0).map(() => Math.floor(Math.random() * -30));
    }
    window.addEventListener('resize', initMatrix);
    initMatrix();

    function drawMatrix() {
      mCtx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
      mCtx.fillStyle = '#00ff88';
      mCtx.font = '12px monospace';

      for (let i = 0; i < drops.length; i++) {
        const char = matrixChars[Math.floor(Math.random() * matrixChars.length)];
        mCtx.fillText(char, i * 12, drops[i] * 12);
        if (drops[i] * 12 > matrixCanvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        } else {
          drops[i]++;
        }
      }
    }
    setInterval(drawMatrix, 50);

    // Audio & State Engine
    const audio = document.getElementById('audioElement');
    let currentIndex = 0;
    let isPlaying = false;
    let audioCtx = null;
    let analyser = null;
    let source = null;
    let dataArray = null;

    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const trackTitle = document.getElementById('trackTitle');
    const trackCounter = document.getElementById('trackCounter');
    const timeDisplay = document.getElementById('timeDisplay');
    const bitrate = document.getElementById('bitrate');
    const progressFill = document.getElementById('progressFill');
    const progressWrap = document.getElementById('progressWrap');
    const statusTag = document.getElementById('statusTag');
    const oscState = document.getElementById('oscState');
    const playlistContainer = document.getElementById('playlistItems');
    const listCounter = document.getElementById('listCounter');

    // Populate Playlist
    function renderPlaylist() {
      playlistContainer.innerHTML = '';
      TRACKS.forEach((track, idx) => {
        const row = document.createElement('div');
        row.className = `playlist-item ${idx === currentIndex ? 'active' : ''}`;
        row.id = `track-${idx}`;
        row.innerHTML = `
          <div style="display:flex; align-items:center; gap:6px; overflow:hidden;">
            <span style="font-size:9px; opacity:0.8; width:22px;">[${String(idx + 1).padStart(2, '0')}]</span>
            <span class="track-name">${track.title}</span>
          </div>
          ${idx === currentIndex ? `<span class="track-badge">${isPlaying ? 'PLAYING' : 'PAUSED'}</span>` : ''}
        `;
        row.addEventListener('click', () => loadTrack(idx, true));
        playlistContainer.appendChild(row);
      });

      const activeEl = document.getElementById(`track-${currentIndex}`);
      if (activeEl) {
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function initAudioContext() {
      if (audioCtx) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      } catch (e) {
        // Fallback procedural
      }
    }

    function formatTime(secs) {
      if (isNaN(secs) || secs <= 0) return '00:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function loadTrack(index, autoPlay = false) {
      currentIndex = (index + TRACKS.length) % TRACKS.length;
      const track = TRACKS[currentIndex];
      audio.src = track.url;
      trackTitle.textContent = track.title.toUpperCase();
      trackCounter.textContent = `${String(currentIndex + 1).padStart(2, '0')}/${TRACKS.length}`;
      listCounter.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${TRACKS.length}`;
      progressFill.style.width = '0%';
      bitrate.textContent = 'LOADING...';

      renderPlaylist();

      if (autoPlay) {
        initAudioContext();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        audio.play().then(() => {
          setPlayState(true);
        }).catch(() => {
          setPlayState(false);
        });
      }
    }

    function setPlayState(playing) {
      isPlaying = playing;
      playBtn.textContent = isPlaying ? '❚❚ PAUSE' : '▶ PLAY';
      playBtn.classList.toggle('playing', isPlaying);
      statusTag.textContent = isPlaying ? 'ONLINE' : 'STANDBY';
      oscState.textContent = isPlaying ? 'ACTIVE' : 'IDLE';
      renderPlaylist();
    }

    function togglePlay() {
      initAudioContext();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

      if (isPlaying) {
        audio.pause();
        setPlayState(false);
      } else {
        audio.play().then(() => {
          setPlayState(true);
        }).catch(err => {
          console.error(err);
          setPlayState(false);
        });
      }
    }

    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', () => loadTrack(currentIndex - 1, isPlaying));
    nextBtn.addEventListener('click', () => loadTrack(currentIndex + 1, isPlaying));

    audio.addEventListener('loadedmetadata', () => {
      timeDisplay.textContent = `00:00 / ${formatTime(audio.duration)}`;
      bitrate.textContent = '320 KBPS';
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${pct}%`;
        timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
      }
    });

    audio.addEventListener('ended', () => loadTrack(currentIndex + 1, true));

    progressWrap.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progressWrap.getBoundingClientRect();
      const clickRatio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audio.currentTime = clickRatio * audio.duration;
    });

    // Oscilloscope Visualizer
    const vCanvas = document.getElementById('visualizer');
    const vCtx = vCanvas.getContext('2d');
    let synthPhase = 0;

    function resizeVisualizer() {
      vCanvas.width = vCanvas.offsetWidth;
      vCanvas.height = vCanvas.offsetHeight;
    }
    window.addEventListener('resize', resizeVisualizer);
    resizeVisualizer();

    function renderVisualizer() {
      requestAnimationFrame(renderVisualizer);
      const width = vCanvas.width;
      const height = vCanvas.height;
      if (!width || !height) return;

      vCtx.clearRect(0, 0, width, height);
      vCtx.lineWidth = 1.5;
      vCtx.strokeStyle = '#00ff88';

      if (isPlaying) {
        let hasData = false;
        const bufLen = analyser ? analyser.frequencyBinCount : 128;
        if (!dataArray || dataArray.length !== bufLen) {
          dataArray = new Uint8Array(bufLen);
        }

        if (analyser) {
          try {
            analyser.getByteFrequencyData(dataArray);
            for (let i = 0; i < Math.min(bufLen, 24); i++) {
              if (dataArray[i] > 0) { hasData = true; break; }
            }
          } catch(e) {}
        }

        if (!hasData) {
          synthPhase += 0.12;
          for (let i = 0; i < bufLen; i++) {
            const w1 = Math.sin(i * 0.18 + synthPhase) * 45;
            const w2 = Math.cos(i * 0.08 - synthPhase * 0.7) * 35;
            const w3 = Math.sin(i * 0.3 + synthPhase * 1.5) * 20;
            dataArray[i] = Math.max(10, Math.min(245, 128 + (w1 + w2 + w3)));
          }
        }

        // Original Oscilloscope Formula
        vCtx.beginPath();
        const sliceWidth = width / bufLen;
        let x = 0;
        for (let i = 0; i < bufLen; i++) {
          const v = dataArray[i] / 128;
          const y = (v * height) / 2;
          if (i === 0) vCtx.moveTo(x, y);
          else vCtx.lineTo(x, y);
          x += sliceWidth;
        }
        vCtx.stroke();
      } else {
        // Flat baseline
        vCtx.beginPath();
        vCtx.moveTo(0, height / 2);
        vCtx.lineTo(width, height / 2);
        vCtx.stroke();
      }
    }
    renderVisualizer();

    // Initial setup
    loadTrack(0, false);
  </script>
</body>
</html>
