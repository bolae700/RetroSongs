<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POLA XAT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --main-color: #00ff88;
      --bg-color: #000000;
      --secondary-color: #00ff8822;
      --terminal-font: 'JetBrains Mono', monospace;
      --brand-font: 'Syne', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="10" viewBox="0 0 8 10"><path fill="%2300ff88" d="M0 0L8 5L0 10Z"/></svg>') 2 5, auto;
      background-color: var(--bg-color);
      color: var(--main-color);
      font-family: var(--terminal-font);
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
      -webkit-font-smoothing: antialiased;
    }

    .matrix-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.25;
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-card {
      width: 100%;
      background: #030704;
      border: 2px solid var(--main-color);
      overflow: hidden;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #001206;
      border-bottom: 1px solid var(--main-color);
    }

    .brand-title {
      font-family: var(--brand-font);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--main-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      background: var(--main-color);
    }

    .status-tag {
      font-size: 9px;
      padding: 2px 6px;
      border: 1px solid rgba(0, 255, 136, 0.6);
      background: #000;
      color: var(--main-color);
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* Visualizer Canvas Deck */
    .visual-screen {
      position: relative;
      height: 75px;
      background: linear-gradient(45deg, #001408 25%, #020202 25%, #020202 50%, #001408 50%, #001408 75%, #020202 75%);
      background-size: 8px 8px;
      animation: bgScroll 25s linear infinite;
      border-bottom: 1px solid var(--main-color);
      overflow: hidden;
    }

    @keyframes bgScroll {
      0% { background-position: 0 0; }
      100% { background-position: 80px 80px; }
    }

    #visualizer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .screen-tag-left {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 8px;
      color: rgba(0, 255, 136, 0.6);
      letter-spacing: 1px;
      pointer-events: none;
    }

    .screen-tag-right {
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 8px;
      color: rgba(0, 255, 136, 0.6);
      letter-spacing: 1px;
      pointer-events: none;
    }

    /* Isolated Metadata Deck */
    .meta-deck {
      padding: 8px 12px;
      background: #001006;
      border-bottom: 1px solid var(--main-color);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .track-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--main-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .track-counter {
      font-size: 9px;
      padding: 1px 5px;
      border: 1px solid rgba(0, 255, 136, 0.4);
      background: #000;
      color: var(--main-color);
      flex-shrink: 0;
    }

    .meta-sub-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5px;
      padding-top: 4px;
      border-top: 1px solid rgba(0, 255, 136, 0.25);
    }

    .bitrate-box {
      font-size: 8.5px;
      letter-spacing: 1px;
      color: var(--main-color);
    }

    /* Interactive Progress Bar */
    .progress-wrap {
      height: 7px;
      background: #00160a;
      cursor: pointer;
      position: relative;
      border-bottom: 1px solid var(--main-color);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--main-color);
      transition: width 0.08s linear;
      position: relative;
    }

    .progress-wrap:hover .progress-handle {
      opacity: 1;
    }

    .progress-handle {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translate(50%, -50%);
      width: 7px;
      height: 12px;
      background: var(--main-color);
      border: 1px solid #000;
      opacity: 0;
      transition: opacity 0.15s;
    }

    /* Vectorized Controls - Zero Colored Emojis */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 8px;
      background: #020503;
    }

    .control-btn {
      height: 36px;
      background: #001408;
      border: 1px solid var(--main-color);
      color: var(--main-color);
      font-family: var(--terminal-font);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .control-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      stroke: currentColor;
      flex-shrink: 0;
    }

    .control-btn:hover {
      background: var(--main-color);
      color: #000;
    }

    .control-btn.playing {
      background: var(--main-color);
      color: #000;
      font-weight: 700;
    }

    .control-btn:active {
      transform: scale(0.98);
    }

    /* Status Footer */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 12px;
      background: #001006;
      border-top: 1px solid rgba(0, 255, 136, 0.6);
      font-size: 9px;
      letter-spacing: 1px;
    }

    /* Playlist Section */
    .playlist-card {
      width: 100%;
      background: #030704;
      border: 1px solid var(--main-color);
      display: flex;
      flex-direction: column;
    }

    .playlist-header {
      padding: 6px 12px;
      background: #001408;
      border-bottom: 1px solid var(--main-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    .playlist-items {
      max-height: 155px;
      overflow-y: auto;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .playlist-items::-webkit-scrollbar {
      width: 3px;
    }
    .playlist-items::-webkit-scrollbar-track {
      background: #020703;
    }
    .playlist-items::-webkit-scrollbar-thumb {
      background: var(--main-color);
    }

    .playlist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 8px;
      font-size: 10.5px;
      color: var(--main-color);
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      white-space: nowrap;
      overflow: hidden;
    }

    .playlist-item .track-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .playlist-item:hover {
      background: var(--main-color);
      color: #000;
      font-weight: 600;
    }

    .playlist-item:hover .hover-action {
      color: #000 !important;
      opacity: 1 !important;
    }

    .playlist-item.active {
      background: var(--main-color);
      color: #000;
      font-weight: 700;
    }

    .playlist-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 8px;
      font-weight: 700;
      padding: 1px 4px;
      border: 1px solid #000;
      margin-left: 6px;
      flex-shrink: 0;
      background: var(--main-color);
      color: #000;
    }

    .playlist-badge svg {
      width: 9px;
      height: 9px;
      fill: #000;
    }

    @media (max-width: 360px) {
      .wrapper {
        max-width: 100%;
      }
      .brand-title {
        font-size: 14px;
      }
      .control-btn {
        font-size: 10px;
        height: 32px;
      }
    }
  </style>
</head>
<body>

  <canvas class="matrix-bg" id="matrixCanvas"></canvas>

  <div class="wrapper">
    <!-- Main Player Deck -->
    <div class="player-card">
      <div class="header-bar">
        <div class="brand-title">
          <span class="brand-dot"></span>
          <span>POLA XAT</span>
        </div>
        <div class="status-tag" id="statusTag">STANDBY</div>
      </div>

      <!-- Oscilloscope Visualizer Screen -->
      <div class="visual-screen">
        <canvas id="visualizer"></canvas>
        <span class="screen-tag-left">OSC // LIVE WAVE</span>
        <span class="screen-tag-right" id="oscState">IDLE</span>
      </div>

      <!-- Track Information & Telemetry Deck -->
      <div class="meta-deck">
        <div class="meta-top-row">
          <div style="display:flex; align-items:center; gap:6px; overflow:hidden;">
            <!-- Vector Music Note Icon -->
            <svg style="width:12px; height:12px; flex-shrink:0; fill:currentColor;" viewBox="0 0 24 24">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
            <span class="track-title" id="trackTitle">MIDNIGHT RIDE</span>
          </div>
          <span class="track-counter" id="trackCounter">01/45</span>
        </div>

        <div class="meta-sub-row">
          <span id="timeDisplay">00:00 / 00:00</span>
          <div class="bitrate-box">
            <span>BITRATE: </span>
            <strong id="bitrate">320 KBPS</strong>
          </div>
        </div>
      </div>

      <!-- Interactive Progress Bar -->
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-fill" id="progressFill">
          <div class="progress-handle"></div>
        </div>
      </div>

      <!-- Controls Grid - Pure Clean SVGs -->
      <div class="controls-grid">
        <button class="control-btn" id="prevBtn" type="button" aria-label="Previous Track">
          <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke-width="2.5"></line></svg>
          <span>PREV</span>
        </button>

        <button class="control-btn" id="playBtn" type="button" aria-label="Play or Pause">
          <span id="playIconWrap" style="display:flex; align-items:center; gap:5px;">
            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <span>PLAY</span>
          </span>
        </button>

        <button class="control-btn" id="nextBtn" type="button" aria-label="Next Track">
          <span>NEXT</span>
          <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke-width="2.5"></line></svg>
        </button>
      </div>

      <!-- Footer Telemetry -->
      <div class="status-bar">
        <span>VOL: 100%</span>
        <span>AUDIO: HD STEREO</span>
      </div>
    </div>

    <!-- Playlist Deck -->
    <div class="playlist-card">
      <div class="playlist-header">
        <div style="display:flex; align-items:center; gap:6px;">
          <span style="width:5px; height:5px; background:var(--main-color);"></span>
          <span>PLAYLIST // الأغاني</span>
        </div>
        <span id="listCounter" style="border:1px solid rgba(0,255,136,0.4); padding:1px 5px; background:#000;">01 / 45</span>
      </div>
      <div class="playlist-items" id="playlistItems"></div>
    </div>
  </div>

  <audio id="audioElement" crossOrigin="anonymous" preload="metadata"></audio>

  <script>
    // Complete 45 Tracks with Shuffled & Non-Linear Distribution
    const TRACKS = [
      { id: 1, title: 'Drop That Right On The Floor', url: 'https://audio.jukehost.co.uk/01a08f24-7fdf-735b-b8a3-c6c2b00a7e2a' },      
      { id: 1, title: 'Alright', url: 'https://audio.jukehost.co.uk/01a08f24-80ab-73e8-9ae1-fda657ae3fba' },         
      { id: 1, title: 'Catch Me In The Spot', url: 'https://audio.jukehost.co.uk/01a08f24-808a-72c3-bd4d-5478e2e03f5d' },
      { id: 2, title: 'Sube', url: 'https://audio.jukehost.co.uk/01a08f24-8032-71ed-a339-a850bbbcbd1e' },
    ];

    // Background Matrix Animation
    const matrixCanvas = document.getElementById('matrixCanvas');
    const mCtx = matrixCanvas.getContext('2d');
    const matrixChars = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    let drops = [];

    function initMatrix() {
      matrixCanvas.width = window.innerWidth;
      matrixCanvas.height = window.innerHeight;
      const cols = Math.floor(matrixCanvas.width / 12);
      drops = Array(cols).fill(0).map(() => Math.floor(Math.random() * -30));
    }
    window.addEventListener('resize', initMatrix);
    initMatrix();

    function drawMatrix() {
      mCtx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
      mCtx.fillStyle = '#00ff88';
      mCtx.font = '12px monospace';

      for (let i = 0; i < drops.length; i++) {
        const char = matrixChars[Math.floor(Math.random() * matrixChars.length)];
        mCtx.fillText(char, i * 12, drops[i] * 12);
        if (drops[i] * 12 > matrixCanvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        } else {
          drops[i]++;
        }
      }
    }
    setInterval(drawMatrix, 50);

    // Audio Engine & State
    const audio = document.getElementById('audioElement');
    let currentIndex = 0;
    let isPlaying = false;
    let audioCtx = null;
    let analyser = null;
    let source = null;
    let dataArray = null;

    const playBtn = document.getElementById('playBtn');
    const playIconWrap = document.getElementById('playIconWrap');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const trackTitle = document.getElementById('trackTitle');
    const trackCounter = document.getElementById('trackCounter');
    const timeDisplay = document.getElementById('timeDisplay');
    const bitrate = document.getElementById('bitrate');
    const progressFill = document.getElementById('progressFill');
    const progressWrap = document.getElementById('progressWrap');
    const statusTag = document.getElementById('statusTag');
    const oscState = document.getElementById('oscState');
    const playlistContainer = document.getElementById('playlistItems');
    const listCounter = document.getElementById('listCounter');

    function renderPlaylist() {
      playlistContainer.innerHTML = '';
      TRACKS.forEach((track, idx) => {
        const row = document.createElement('div');
        row.className = `playlist-item ${idx === currentIndex ? 'active' : ''}`;
        row.id = `track-${idx}`;
        row.innerHTML = `
          <div style="display:flex; align-items:center; gap:6px; overflow:hidden;">
            <span style="font-size:9px; opacity:0.75; width:26px; font-family:monospace;">[${String(idx + 1).padStart(2, '0')}]</span>
            <span class="track-name">${track.title}</span>
          </div>
          ${idx === currentIndex ? `
            <span class="playlist-badge">
              ${isPlaying ? `
                <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <span>PLAYING</span>
              ` : `
                <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                <span>PAUSED</span>
              `}
            </span>
          ` : `
            <span class="hover-action" style="font-size:8.5px; opacity:0; letter-spacing:1px; display:inline-flex; align-items:center; gap:3px; margin-left:6px; flex-shrink:0;">
              <span>PLAY</span>
              <svg style="width:8px; height:8px; fill:currentColor;" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </span>
          `}
        `;
        row.addEventListener('click', () => loadTrack(idx, true));
        playlistContainer.appendChild(row);
      });

      const activeEl = document.getElementById(`track-${currentIndex}`);
      if (activeEl) {
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function initAudioContext() {
      if (audioCtx) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      } catch (e) {
        // Fallback procedural
      }
    }

    function formatTime(secs) {
      if (isNaN(secs) || secs <= 0) return '00:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function loadTrack(index, autoPlay = false) {
      currentIndex = (index + TRACKS.length) % TRACKS.length;
      const track = TRACKS[currentIndex];
      audio.src = track.url;
      trackTitle.textContent = track.title.toUpperCase();
      trackCounter.textContent = `${String(currentIndex + 1).padStart(2, '0')}/${TRACKS.length}`;
      listCounter.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${TRACKS.length}`;
      progressFill.style.width = '0%';
      bitrate.textContent = 'LOADING...';

      renderPlaylist();

      if (autoPlay) {
        initAudioContext();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        audio.play().then(() => {
          setPlayState(true);
        }).catch(() => {
          setPlayState(false);
        });
      }
    }

    function setPlayState(playing) {
      isPlaying = playing;
      playBtn.classList.toggle('playing', isPlaying);
      if (isPlaying) {
        playIconWrap.innerHTML = `
          <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          <span>PAUSE</span>
        `;
      } else {
        playIconWrap.innerHTML = `
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span>PLAY</span>
        `;
      }
      statusTag.textContent = isPlaying ? 'ONLINE' : 'STANDBY';
      oscState.textContent = isPlaying ? 'ACTIVE' : 'IDLE';
      renderPlaylist();
    }

    function togglePlay() {
      initAudioContext();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

      if (isPlaying) {
        audio.pause();
        setPlayState(false);
      } else {
        audio.play().then(() => {
          setPlayState(true);
        }).catch(err => {
          console.error(err);
          setPlayState(false);
        });
      }
    }

    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', () => loadTrack(currentIndex - 1, isPlaying));
    nextBtn.addEventListener('click', () => loadTrack(currentIndex + 1, isPlaying));

    audio.addEventListener('loadedmetadata', () => {
      timeDisplay.textContent = `00:00 / ${formatTime(audio.duration)}`;
      bitrate.textContent = '320 KBPS';
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${pct}%`;
        timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
      }
    });

    audio.addEventListener('ended', () => loadTrack(currentIndex + 1, true));

    progressWrap.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progressWrap.getBoundingClientRect();
      const clickRatio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audio.currentTime = clickRatio * audio.duration;
    });

    // Oscilloscope Real-time Waveform Canvas
    const vCanvas = document.getElementById('visualizer');
    const vCtx = vCanvas.getContext('2d');
    let synthPhase = 0;

    function resizeVisualizer() {
      vCanvas.width = vCanvas.offsetWidth;
      vCanvas.height = vCanvas.offsetHeight;
    }
    window.addEventListener('resize', resizeVisualizer);
    resizeVisualizer();

    function renderVisualizer() {
      requestAnimationFrame(renderVisualizer);
      const width = vCanvas.width;
      const height = vCanvas.height;
      if (!width || !height) return;

      vCtx.clearRect(0, 0, width, height);
      vCtx.lineWidth = 1.5;
      vCtx.strokeStyle = '#00ff88';

      if (isPlaying) {
        let hasData = false;
        const bufLen = analyser ? analyser.frequencyBinCount : 128;
        if (!dataArray || dataArray.length !== bufLen) {
          dataArray = new Uint8Array(bufLen);
        }

        if (analyser) {
          try {
            analyser.getByteFrequencyData(dataArray);
            for (let i = 0; i < Math.min(bufLen, 24); i++) {
              if (dataArray[i] > 0) { hasData = true; break; }
            }
          } catch(e) {}
        }

        if (!hasData) {
          synthPhase += 0.12;
          for (let i = 0; i < bufLen; i++) {
            const w1 = Math.sin(i * 0.18 + synthPhase) * 45;
            const w2 = Math.cos(i * 0.08 - synthPhase * 0.7) * 35;
            const w3 = Math.sin(i * 0.3 + synthPhase * 1.5) * 20;
            dataArray[i] = Math.max(10, Math.min(245, 128 + (w1 + w2 + w3)));
          }
        }

        // Oscilloscope Formula
        vCtx.beginPath();
        const sliceWidth = width / bufLen;
        let x = 0;
        for (let i = 0; i < bufLen; i++) {
          const v = dataArray[i] / 128;
          const y = (v * height) / 2;
          if (i === 0) vCtx.moveTo(x, y);
          else vCtx.lineTo(x, y);
          x += sliceWidth;
        }
        vCtx.stroke();
      } else {
        // Paused Flat Baseline
        vCtx.beginPath();
        vCtx.moveTo(0, height / 2);
        vCtx.lineTo(width, height / 2);
        vCtx.stroke();
      }
    }
    renderVisualizer();

    // Initial load
    loadTrack(0, false);
  </script>
</body>
</html>
